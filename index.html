<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>不可视界线</title>


<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f2f0eb;

    font-family:
    "Microsoft YaHei",
    sans-serif;

    color:#444;

}




#game{


    width:900px;

    height:680px;

    background:#ffffff;

    border-radius:25px;

    box-shadow:
    0 15px 45px rgba(0,0,0,.12);

    overflow:hidden;

    display:flex;

    flex-direction:column;


}





.header{


    height:75px;

    background:#edf3f8;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:bold;

    color:#52697d;


}



.subtitle{


    font-size:14px;

    margin-left:15px;

    color:#999;

    font-weight:normal;

}




.status{


    height:55px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:50px;

    background:#fafafa;

    border-bottom:1px solid #ddd;


}






.dialogue{


    flex:1;

    padding:25px 35px;


}





.name{


    display:inline-block;

    background:#89a9c8;

    color:white;

    padding:8px 25px;

    border-radius:20px;

    font-size:18px;


}





.text{


    margin-top:18px;

    height:260px;

    overflow-y:auto;

    font-size:18px;

    line-height:1.8;

    letter-spacing:.5px;


}





.choice{


    height:170px;

    padding:10px 35px;

    background:#fafafa;


}





button{


    width:100%;

    height:42px;

    margin-bottom:10px;

    border-radius:15px;

    border:

    1px solid #ccd8e3;

    background:#ffffff;

    color:#52697d;

    font-size:16px;

    cursor:pointer;

    transition:.2s;


}



button:hover{


    background:#eaf3fa;

    transform:translateY(-2px);


}





.footer{


    height:25px;

    text-align:center;

    color:#aaa;

    font-size:12px;


}



</style>


</head>



<body>


<div id="game">



<div class="header">

✦ 不可视界线 ✦

<span class="subtitle">
第一章：转校生与幻界之眼
</span>


</div>



<div class="status">


<div>
💙 程岚信赖：
<span id="love">0</span>
</div>


<div>
🔥 幻界共鸣：
<span id="chuni">0</span>
</div>


<div>
🌱 现实值：
<span id="real">50</span>
</div>



</div>




<div class="dialogue">


<div class="name" id="name">

</div>


<div class="text" id="text">

</div>


</div>





<div class="choice" id="choice">

</div>




<div class="footer">

✦ 每一次选择，都改变未来 ✦

</div>




</div>




<script>


let player={

love:0,

chuni:0,

real:50

};



let scene="start";



const story={



start:{


name:"旁白",


text:`

春天。

<br>
樱花飘落。

<br>
你站在新的高中门口。

<br>
新的学校，新的班级，新的生活。

<br>
你深吸一口气。

<br>
“这一次，我一定要成为普通人。”

<br>
过去那个相信幻想，相信特殊力量的自己。

<br>
已经结束了。

`,


choices:[

["进入学校","school"]

]

},




school:{


name:"旁白",


text:`

一年A班。

<br>
老师介绍完新同学。

<br>
你走到讲台前。

<br>
简单介绍自己。

<br>
台下响起普通的掌声。

<br>
很好。

<br>
没有人注意你。

<br>
没有人知道你的过去。

`,


choices:[

["坐到自己的位置","seat"]

]

},





seat:{


name:"旁白",


text:`

你坐下。

<br>
原本以为今天会平静结束。

<br>
但是。

<br>
你的视线停住了。

<br>
窗边的位置。

<br>
一个少女正在看着天空。

<br>
她戴着黑色眼罩。

<br>
桌上放着一本奇怪的笔记。

<br>
手腕缠着绷带。

<br>
她像是在寻找某种不存在的东西。

`,


choices:[

["观察她","observe"],

["不要理会","ignore"]

]

},






observe:{


name:"旁白",


text:`

少女低声说道：

<br>
“检测到异常波动。”

<br>
“不可视界线……”

<br>
“果然存在。”

<br>
你的心突然跳了一下。

<br>
因为这种话。

<br>
你曾经也说过。

`,


choices:[

["询问她","meet"]

]

},





ignore:{


name:"旁白",


text:`

你移开视线。

<br>
告诉自己不要多管闲事。

<br>
但是。

<br>
那个少女的声音。

<br>
一直留在你的脑海。

`,


choices:[

["午休再看看","lunch"]

]

},




meet:{


name:"程岚",


text:`

少女转过头。

<br>
“你……”

<br>
“刚才是不是听到了？”

<br>
她认真看着你。

<br>
“你也能感受到隐藏世界？”

`,


choices:[

["你说的是什么？","ask"],

["我只是普通人","normal"]

]

},




ask:{


name:"程岚",


text:`

“不可视界线。”

<br>
“现实与隐藏世界的交界。”

<br>
“只有特殊的人才能发现。”

<br>
她靠近一点。

<br>
“你的眼睛……”

<br>
“曾经觉醒过。”

`,


choices:[

["承认过去","memory"],

["否认","deny"]

]

},




memory:{


name:"旁白",


text:`

小时候。

<br>
你也相信世界隐藏着秘密。

<br>
你也幻想过自己拥有特殊力量。

<br>
但是后来。

<br>
你选择成为普通人。

`,


effect:function(){

player.chuni+=10;

},


choices:[

["继续","lunch"]

]

},




deny:{


name:"旁白",


text:`

“不。”

<br>
“你认错人了。”

<br>
程岚看着你。

<br>
她没有继续追问。

`,


choices:[

["午休","lunch"]

]

},




normal:{


name:"程岚",


text:`

“普通人？”

<br>
程岚歪了歪头。

<br>
“可是你的气息不像。”

`,


choices:[

["午休","lunch"]

]

},


lunch:{


name:"旁白",


text:`

午休时间。

<br>
你来到天台。

<br>
这里比教室安静很多。

<br>
你本来只是想一个人吃饭。

<br>
但是。

<br>
那个少女已经在那里。

<br>
她坐在栏杆旁。

<br>
手里拿着那本奇怪的笔记。

<br>
封面写着：

<br>
《不可视界线调查记录》

`,


choices:[

["询问她","roof"],

["偷偷观察","watch"]

]

},





watch:{


name:"旁白",


text:`

你没有马上靠近。

<br>
只是远远观察。

<br>
你发现。

<br>
程岚并不是在装神秘。

<br>
她真的相信那个隐藏世界存在。

<br>
而且。

<br>
她似乎很期待有人能够理解她。

`,


choices:[

["走过去","roof"]

]

},




roof:{


name:"程岚",


text:`

“你来了。”

<br>
程岚合上笔记。

<br>
“我已经确认。”

<br>
“你拥有观察隐藏世界的可能。”

<br>
她看着天空。

<br>
“这个世界上。”

<br>
一定存在普通人无法看见的东西。

`,


choices:[

["你为什么相信它存在？","reason"],

["你想找到什么？","goal"]

]

},




reason:{


name:"程岚",


text:`

程岚沉默了一会。

<br>
“因为……”

<br>
“我曾经失去过重要的东西。”

<br>
她低下头。

<br>
“如果那个世界真的存在。”

<br>
“也许那里会留下答案。”

`,


effect:function(){

player.love+=5;

},


choices:[

["继续听她说","club"]

]

},




goal:{


name:"程岚",


text:`

“不可视界线。”

<br>
“那是连接两个世界的地方。”

<br>
“我想找到它。”

<br>
“证明自己没有错。”

`,


effect:function(){

player.chuni+=5;

},


choices:[

["帮助她寻找","club"],

["劝她放弃","reality"]

]

},





reality:{


name:"旁白",


text:`

你告诉她。

<br>
“也许那些只是幻想。”

<br>
程岚没有反驳。

<br>
只是安静地看着远方。

<br>
“如果是幻想。”

<br>
“为什么我会那么希望它是真的呢？”

`,


effect:function(){

player.real+=5;

},


choices:[

["陪她一会","club"]

]

},





club:{


name:"程岚",


text:`

下午放学。

<br>
程岚带你来到旧校舍。

<br>
这里几乎没有学生经过。

<br>
门牌已经有些老旧。

<br>
上面写着：

<br><br>

【幻界观测研究社】

<br><br>

“从今天开始。”

<br>
“这里就是我们的基地。”

`,


choices:[

["加入这个社团","join"],

["先看看","join"]

]

},




join:{


name:"旁白",


text:`

你环顾四周。

<br>
墙上贴满奇怪的符号。

<br>
桌上放着各种奇怪道具。

<br>
如果是以前的你。

<br>
或许会觉得这里很正常。

<br>
但是现在。

<br>
你只觉得有点怀念。

`,


effect:function(){

player.love+=10;

},


choices:[

["继续探索","next"]

]

},




next:{


name:"旁白",


text:`

就在这时。

<br>
社团门突然打开。

<br>
一个少年站在门口。

<br>
他看着房间里的布置。

<br>
露出了复杂的表情。

<br><br>

“你们……”

<br>
“又开始这种事情了吗？”

`,


choices:[

["询问他是谁","boy"]

]

},





boy:{


name:"陈一鑫",


text:`

少年走进房间。

<br>
“我是陈一鑫。”

<br>
“这个学校的学生。”

<br>
他的视线落在程岚身上。

<br>
“你知道吗？”

<br>
“以前也有人相信这些东西。”

<br><br>

他看向你。

<br>
“而且。”

<br>
“那个家伙现在正在努力忘掉过去。”

`,


choices:[

["什么意思？","past"],

["保持沉默","past"]

]

},




past:{


name:"陈一鑫",


text:`

陈一鑫叹了一口气。

<br>
“看来你还没有告诉他。”

<br>
程岚看着你。

<br>
似乎想说什么。

<br>
但是最后没有开口。

<br><br>

放学后的校园。

<br>
第一次出现了新的谜团。

`,


choices:[

["继续","end"]

]

},





end:{


name:"旁白",


text:`

【第一章 第一节】

<br><br>

《那个看见隐藏世界的少女》

<br><br>

完成。

<br><br>

当前状态：

<br>
💙 程岚信赖：
`+
player.love+
`

<br>
🔥 幻界共鸣：
`
+player.chuni+
`

<br>
🌱 现实值：
`
+player.real+
`

<br><br>

下一节：

<br>
《幻界观测研究社》

<br>
即将开始。

`,


choices:[]

}



};





// ===== 游戏运行 =====



function typeWriter(element,html){


element.innerHTML="";


let text=html;


let index=0;


let timer=setInterval(()=>{


element.innerHTML=text.substring(0,index);


index++;


if(index>=text.length){

clearInterval(timer);

}



},15);


}




function render(){


let data=story[scene];


if(data.effect){

data.effect();

}



document.getElementById("love").innerText=
player.love;


document.getElementById("chuni").innerText=
player.chuni;


document.getElementById("real").innerText=
player.real;



document.getElementById("name").innerText=
data.name;



typeWriter(

document.getElementById("text"),

data.text

);



let box=document.getElementById("choice");


box.innerHTML="";



data.choices.forEach(item=>{


let btn=document.createElement("button");


btn.innerText="✦ "+item[0];


btn.onclick=function(){


scene=item[1];


render();


};



box.appendChild(btn);


});



}



render();



</script>


</body>

</html>
