<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>不可视界线</title>


<style>


*{
box-sizing:border-box;
}



html,body{

margin:0;

padding:0;

width:100%;

min-height:100%;

}



body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#f2f0eb;

font-family:

"Microsoft YaHei",
sans-serif;

color:#444;

padding:10px;

}





#game{


width:900px;

max-width:100%;


height:680px;

max-height:95vh;


background:white;


border-radius:25px;


box-shadow:

0 15px 45px rgba(0,0,0,.12);


overflow:hidden;


display:flex;

flex-direction:column;


}





.header{


height:75px;


background:#edf3f8;


display:flex;


align-items:center;


justify-content:center;


font-size:28px;


font-weight:bold;


color:#52697d;


flex-shrink:0;


}





.subtitle{


font-size:14px;

margin-left:15px;

color:#999;

font-weight:normal;


}






.status{


height:55px;


display:flex;


justify-content:center;


align-items:center;


gap:50px;


background:#fafafa;


border-bottom:

1px solid #ddd;


flex-shrink:0;


}






.dialogue{


flex:1;


padding:

25px 35px;


overflow:hidden;


}





.name{


display:inline-block;


background:#89a9c8;


color:white;


padding:

8px 25px;


border-radius:20px;


font-size:18px;


}







.text{


margin-top:18px;


height:260px;


overflow-y:auto;


font-size:18px;


line-height:1.8;


letter-spacing:.5px;


}




.choice{


height:170px;


padding:

10px 35px;


background:#fafafa;


flex-shrink:0;


}






button{


width:100%;


height:42px;


margin-bottom:10px;


border-radius:15px;


border:

1px solid #ccd8e3;


background:white;


color:#52697d;


font-size:16px;


cursor:pointer;


transition:.2s;


}





button:hover{


background:#eaf3fa;


transform:translateY(-2px);


}





.footer{


height:25px;


text-align:center;


color:#aaa;


font-size:12px;


flex-shrink:0;


}






/* 手机适配 */

@media(max-width:600px){



body{

padding:5px;

align-items:center;

}




#game{


width:100%;


height:95vh;


border-radius:18px;


}




.header{


height:60px;


font-size:22px;


}



.subtitle{

display:none;

}



.status{


height:45px;


gap:8px;


font-size:12px;


}



.dialogue{


padding:

18px;


}





.name{


font-size:15px;


padding:

6px 18px;


}




.text{


height:300px;


font-size:16px;


line-height:1.7;


}





.choice{


height:auto;


padding:

10px 18px;


}





button{


height:45px;


font-size:15px;


border-radius:12px;


}



.footer{


font-size:11px;


}



}




</style>


</head>
<body>


<div id="game">


<div class="header">

✦ 不可视界线 ✦

<span class="subtitle">
第一章：转校生与幻界之眼
</span>

</div>



<div class="status">


<div>
💙 程岚信赖：
<span id="love">0</span>
</div>


<div>
🔥 幻界共鸣：
<span id="chuni">0</span>
</div>


<div>
🌱 现实值：
<span id="real">50</span>
</div>


</div>





<div class="dialogue">


<div class="name" id="name">

</div>


<div class="text" id="text">

</div>


</div>





<div class="choice" id="choice">

</div>



<div class="footer">

✦ 每一次选择，都改变未来 ✦

</div>



</div>






<script>


let player={

love:0,

chuni:0,

real:50

};



let scene="start";





const story={



start:{


name:"旁白",


text:`

春天。

<br>

樱花飘落。

<br>

你站在新的高中门口。

<br>

新的学校，新的班级，新的生活。

<br>

你深吸一口气。

<br>

“这一次，我一定要成为普通人。”

<br>

过去那个相信幻想的自己。

<br>

已经结束了。

`,


choices:[

["进入学校","school"]

]

},





school:{


name:"旁白",


text:`

一年A班。

<br>

老师介绍完新同学。

<br>

你走到讲台。

<br>

简单介绍自己。

<br>

台下响起普通的掌声。

<br>

很好。

<br>

没有人注意你。

`,


choices:[

["坐到自己的位置","seat"]

]

},






seat:{


name:"旁白",


text:`

你坐下。

<br>

原本以为今天会平静结束。

<br>

但是。

<br>

你的视线停住了。

<br>

窗边。

<br>

一个少女正在看着天空。

<br>

她戴着黑色眼罩。

<br>

桌上放着一本奇怪的笔记。

`,


choices:[

["观察她","observe"],

["不要理会","ignore"]

]

},





observe:{


name:"旁白",


text:`

少女低声说道：

<br>

“检测到异常波动。”

<br>

“不可视界线……”

<br>

“果然存在。”

<br>

你的心跳停了一瞬。

<br>

因为这种话。

<br>

你曾经也说过。

`,


choices:[

["询问她","meet"]

]

},




ignore:{


name:"旁白",


text:`

你移开视线。

<br>

告诉自己不要接触奇怪的人。

<br>

可是。

<br>

那个少女的声音。

<br>

一直留在你的脑海。

`,


choices:[

["午休再看看","lunch"]

]

},





meet:{


name:"程岚",


text:`

少女转过头。

<br>

“你……”

<br>

“刚才是不是听到了？”

<br>

她认真看着你。

<br>

“你也能感受到隐藏世界？”

`,


choices:[

["你说的是什么？","ask"],

["我只是普通人","normal"]

]

},






ask:{


name:"程岚",


text:`

“不可视界线。”

<br>

“现实与隐藏世界的交界。”

<br>

“只有特殊的人才能发现。”

<br>

她靠近一点。

<br>

“你的眼睛……”

<br>

“曾经觉醒过。”

`,


choices:[

["承认过去","memory"],

["否认","deny"]

]

},





memory:{


name:"旁白",


text:`

小时候。

<br>

你也相信世界隐藏着秘密。

<br>

你也幻想过自己拥有特殊力量。

<br>

但是后来。

<br>

你选择成为普通人。

`,


effect:function(){

player.chuni+=10;

},


choices:[

["继续","lunch"]

]

},





deny:{


name:"旁白",


text:`

“不。”

<br>

“你认错人了。”

<br>

程岚看着你。

<br>

她没有继续追问。

`,


choices:[

["午休","lunch"]

]

},





normal:{


name:"程岚",


text:`

“普通人？”

<br>

程岚歪了歪头。

<br>

“可是你的气息不像。”

`,


choices:[

["午休","lunch"]

]

},




lunch:{


name:"旁白",


text:`

午休时间。

<br>

你来到天台。

<br>

原本只是想安静吃饭。

<br>

但是程岚已经在那里。

<br>

她打开那本笔记。

<br>

第一页写着：

<br>

《不可视界线调查记录》

`,


choices:[

["询问她","end"]

]

},




end:{


name:"程岚",


text:`

“你愿意相信我吗？”

<br>

阳光照在她身后。

<br>

你突然想起。

<br>

曾经那个相信奇迹的自己。

<br>

故事。

<br>

才刚刚开始。

<br><br>

【第一章 第一节结束】

`,


choices:[]

}



};







function typeWriter(element,text){


element.innerHTML="";


let i=0;


let timer=setInterval(()=>{


element.innerHTML=text.substring(0,i);


i++;


if(i>=text.length){


clearInterval(timer);


}


},15);


}







function render(){



let data=story[scene];



if(data.effect){

data.effect();

}



document.getElementById("love").innerText=
player.love;


document.getElementById("chuni").innerText=
player.chuni;


document.getElementById("real").innerText=
player.real;



document.getElementById("name").innerText=
data.name;



typeWriter(

document.getElementById("text"),

data.text

);





let box=document.getElementById("choice");


box.innerHTML="";



data.choices.forEach(item=>{


let btn=document.createElement("button");


btn.innerText="✦ "+item[0];



btn.onclick=function(){


scene=item[1];


render();


};



box.appendChild(btn);



});



}





render();



</script>


</body>

</html>
