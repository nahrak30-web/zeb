<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不可视界线</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#f3f1ed;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    color:#444;
    padding:10px;
}

#game{
    width:900px;
    height:700px;
    max-width:100%;
    max-height:95vh;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
    display:flex;
    flex-direction:column;
}

.header{
    height:70px;
    flex-shrink:0;
    background:#edf3f8;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#52697d;
    font-size:27px;
    font-weight:bold;
}

.subtitle{
    margin-left:14px;
    color:#999;
    font-size:14px;
    font-weight:normal;
}

.status{
    height:44px;
    flex-shrink:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:35px;
    background:#fafafa;
    border-bottom:1px solid #e5e5e5;
    font-size:14px;
}

.dialogue{
    flex:1;
    min-height:0;
    padding:22px 35px 8px;
    display:flex;
    flex-direction:column;
}

.name{
    flex-shrink:0;
    align-self:flex-start;
    padding:7px 22px;
    border-radius:20px;
    background:#89a9c8;
    color:#fff;
    font-size:17px;
}

.text{
    flex:1;
    min-height:0;
    margin-top:13px;
    padding-right:8px;
    overflow-y:auto;
    font-size:17px;
    line-height:1.55;
    letter-spacing:.2px;
    word-break:break-word;
    scrollbar-width:thin;
}

.text::-webkit-scrollbar{
    width:5px;
}

.text::-webkit-scrollbar-thumb{
    background:#d5dce2;
    border-radius:10px;
}

.click-hint{
    flex-shrink:0;
    height:25px;
    text-align:right;
    color:#aaa;
    font-size:12px;
    cursor:pointer;
    user-select:none;
}

.choice{
    flex-shrink:0;
    min-height:112px;
    padding:8px 35px 10px;
    background:#fafafa;
    border-top:1px solid #eee;
}

button{
    width:100%;
    min-height:40px;
    margin-bottom:7px;
    padding:7px 15px;
    border:1px solid #ccd8e3;
    border-radius:14px;
    background:#fff;
    color:#52697d;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    transition:.18s;
}

button:hover{
    background:#edf5fb;
    transform:translateY(-1px);
}

button:active{
    transform:translateY(0);
}

.footer{
    height:23px;
    flex-shrink:0;
    text-align:center;
    color:#aaa;
    font-size:11px;
    background:#fafafa;
}

@media(max-width:600px){

    body{
        padding:5px;
        align-items:center;
    }

    #game{
        width:100%;
        height:95vh;
        max-height:none;
        border-radius:17px;
    }

    .header{
        height:56px;
        font-size:21px;
    }

    .subtitle{
        display:none;
    }

    .status{
        height:40px;
        gap:8px;
        font-size:11px;
    }

    .dialogue{
        padding:15px 15px 5px;
    }

    .name{
        padding:6px 17px;
        font-size:15px;
    }

    .text{
        margin-top:11px;
        padding-right:3px;
        font-size:15px;
        line-height:1.5;
    }

    .click-hint{
        height:22px;
        font-size:11px;
    }

    .choice{
        min-height:105px;
        padding:7px 12px 8px;
    }

    button{
        min-height:40px;
        margin-bottom:6px;
        font-size:14px;
        border-radius:12px;
    }

    .footer{
        height:20px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="header">
        ✦ 不可视界线 ✦
        <span class="subtitle" id="chapterTitle">序章：过去的幻想</span>
    </div>

    <div class="status">
        <div>💙 程岚：<span id="love">0</span></div>
        <div>🔥 幻想：<span id="chuni">0</span></div>
        <div>🌱 现实：<span id="real">50</span></div>
    </div>

    <div class="dialogue">

        <div class="name" id="name"></div>

        <div class="text" id="text"></div>

        <div class="click-hint" id="clickHint">
            点击文字继续 ▶
        </div>

    </div>

    <div class="choice" id="choice"></div>

    <div class="footer">
        ✦ 每一次选择，都改变未来 ✦
    </div>

</div>


<script>

let player = {
    love:0,
    chuni:0,
    real:50
};

let scene = "start";

let typing = false;
let typingTimer = null;
let currentText = "";
let currentIndex = 0;


/* =========================================================
   剧情
========================================================= */

const story = {

    /* =========================
       序章
    ========================= */

    start:{
        chapter:"序章：过去的幻想",
        name:"我",
        text:`
            春天。

            <br><br>

            樱花从教学楼之间缓缓飘落。

            <br><br>

            我站在校门前，看着眼前这所完全陌生的高中。

            <br><br>

            新的学校。

            <br>
            新的班级。

            <br>
            新的同学。

            <br><br>

            还有一个新的自己。

            <br><br>

            至少，我希望如此。

            <br><br>

            我低头看了看自己的手。

            <br><br>

            “这一次……”

            <br><br>

            “我要成为普通人。”

            <br><br>

            这句话，我已经在心里重复了很多遍。

            <br><br>

            因为曾经的我，并不是这样的。

            <br><br>

            曾经的我相信世界存在秘密。

            <br>
            相信自己拥有特殊力量。

            <br>
            相信自己与普通人不同。

            <br><br>

            那些东西现在想起来，实在有些丢脸。

            <br><br>

            所以。

            <br><br>

            我决定把它们全部留在过去。
        `,
        choices:[
            ["走进学校","school"]
        ]
    },


    school:{
        chapter:"第一章：转学生与幻想少女",
        name:"我",
        text:`
            一年A班。

            <br><br>

            老师简单介绍完我以后，我走到了自己的座位。

            <br><br>

            教室里没有发生什么特别的事情。

            <br><br>

            这很好。

            <br><br>

            越普通越好。

            <br><br>

            我刚坐下，旁边的人便主动凑了过来。

            <br><br>

            “你好。”

            <br><br>

            “我是钰翔。”

            <br><br>

            我转过头。

            <br><br>

            一个看起来相当普通的男生正冲我笑。

            <br><br>

            “以后就是同学了。”

            <br><br>

            我点点头。

            <br><br>

            “嗯，请多指教。”
        `,
        choices:[
            ["和钰翔聊聊天","yuxiang"]
        ]
    },


    yuxiang:{
        chapter:"第一章：转学生与幻想少女",
        name:"钰翔",
        text:`
            “第一次来这个学校吧？”

            <br><br>

            “嗯。”

            <br><br>

            钰翔神秘兮兮地压低声音。

            <br><br>

            “那我先告诉你一件事。”

            <br><br>

            “这个学校，有传说。”

            <br><br>

            我愣了一下。

            <br><br>

            “传说？”

            <br><br>

            “对。”

            <br><br>

            钰翔朝窗边努了努嘴。

            <br><br>

            “看到那个女生了吗？”

            <br><br>

            我顺着他的目光看过去。

            <br><br>

            一个少女独自坐在窗边。

            <br><br>

            她戴着一只黑色眼罩。

            <br><br>

            桌面上放着一本厚厚的笔记。

            <br><br>

            “她叫程岚。”

            <br><br>

            “听说她每天都在研究什么隐藏世界。”

            <br><br>

            我沉默了。

            <br><br>

            不知道为什么。

            <br><br>

            这个名字，还有那个戴着眼罩的身影。

            <br><br>

            让我产生了一种奇怪的熟悉感。
        `,
        choices:[
            ["询问程岚","ask_chenglan"],
            ["不去管她","ignore_chenglan"]
        ]
    },


    ask_chenglan:{
        chapter:"第一章：转学生与幻想少女",
        name:"我",
        text:`
            “她平时都在做什么？”

            <br><br>

            钰翔耸了耸肩。

            <br><br>

            “谁知道。”

            <br><br>

            “不过我听说，她经常一个人跑到天台。”

            <br><br>

            “而且还会对着天空说话。”

            <br><br>

            我看了一眼窗边。

            <br><br>

            程岚似乎察觉到了我的视线。

            <br><br>

            她转过头。

            <br><br>

            仅仅一瞬间。

            <br><br>

            我们四目相对。

            <br><br>

            她没有移开视线。

            <br><br>

            反而像是在确认什么。

            <br><br>

            我的心里突然产生了一种不太好的预感。
        `,
        choices:[
            ["午休去天台看看","lunch_rooftop"]
        ]
    },


    ignore_chenglan:{
        chapter:"第一章：转学生与幻想少女",
        name:"我",
        text:`
            “算了。”

            <br><br>

            我决定不去管她。

            <br><br>

            毕竟。

            <br><br>

            我来到这里，是为了过普通的高中生活。

            <br><br>

            和奇怪的人保持距离。

            <br>
            是一个很合理的决定。

            <br><br>

            ……至少我是这么想的。

            <br><br>

            午休铃响起。

            <br><br>

            我拿起便当。

            <br><br>

            不知道为什么。

            <br><br>

            我的脚却朝着天台走去。
        `,
        choices:[
            ["去天台","lunch_rooftop"]
        ]
    },


    lunch_rooftop:{
        chapter:"第一章：午休天台",
        name:"我",
        text:`
            天台的门被我推开。

            <br><br>

            春天的风迎面吹来。

            <br><br>

            我原本以为这里应该没有人。

            <br><br>

            但是。

            <br><br>

            程岚已经在那里。

            <br><br>

            她站在围栏旁边。

            <br><br>

            黑色的眼罩遮住了一只眼睛。

            <br><br>

            她手里拿着那本奇怪的笔记。

            <br><br>

            “……距离稳定值还差一点。”

            <br><br>

            我停下脚步。

            <br><br>

            她似乎察觉到了我。

            <br><br>

            “你来了。”

            <br><br>

            我愣住。

            <br><br>

            “你知道我会来？”

            <br><br>

            她点点头。

            <br><br>

            “因为我看见了。”

            <br><br>

            “看见什么？”

            <br><br>

            程岚抬起头。

            <br><br>

            “你身上的……过去。”
        `,
        choices:[
            ["询问她是什么意思","chenglan_meet"]
        ]
    },


    chenglan_meet:{
        chapter:"第一章：午休天台",
        name:"程岚",
        text:`
            “你也曾经相信过吧？”

            <br><br>

            “相信这个世界存在普通人看不到的东西。”

            <br><br>

            我的心跳突然漏了一拍。

            <br><br>

            “我不知道你在说什么。”

            <br><br>

            程岚没有反驳。

            <br><br>

            她只是静静地看着我。

            <br><br>

            “骗人。”

            <br><br>

            “你的眼神已经告诉我答案了。”

            <br><br>

            我没有说话。

            <br><br>

            因为她说中了。

            <br><br>

            我以前真的相信过。

            <br><br>

            那个时候的我，也曾经给自己取过一个很厉害的名字。

            <br><br>

            也曾经幻想自己拥有特殊能力。

            <br><br>

            现在想起来……

            <br><br>

            真的很羞耻。
        `,
        choices:[
            ["承认一点过去","chenglan_accept"],
            ["继续否认","chenglan_deny"]
        ]
    },


    chenglan_accept:{
        chapter:"第一章：午休天台",
        name:"我",
        text:`
            “以前。”

            <br><br>

            我终于承认。

            <br><br>

            “以前的我，确实相信过。”

            <br><br>

            程岚安静了。

            <br><br>

            她没有笑我。

            <br><br>

            只是轻轻点头。

            <br><br>

            “原来如此。”

            <br><br>

            “所以你才能理解。”

            <br><br>

            我看着她。

            <br><br>

            “理解什么？”

            <br><br>

            她看向天空。

            <br><br>

            “一个人明明知道别人无法理解。”

            <br><br>

            “却还是想把自己相信的东西告诉别人。”

            <br><br>

            我沉默了。

            <br><br>

            因为。

            <br><br>

            我好像真的理解。
        `,
        effect:function(){
            player.love += 5;
            player.chuni += 5;
        },
        choices:[
            ["听她继续说","club_invite"]
        ]
    },


    chenglan_deny:{
        chapter:"第一章：午休天台",
        name:"我",
        text:`
            “你认错人了。”

            <br><br>

            我努力让自己的声音听起来正常。

            <br><br>

            程岚歪了歪头。

            <br><br>

            “是吗？”

            <br><br>

            “嗯。”

            <br><br>

            “那就算了。”

            <br><br>

            她没有继续追问。

            <br><br>

            可是。

            <br><br>

            她转身的时候，我却注意到她嘴角露出了一点笑意。

            <br><br>

            像是已经知道了答案。

            <br><br>

            我突然有些不安。

            <br><br>

            这个女生。

            <br><br>

            似乎比我想象得更加敏锐。
        `,
        effect:function(){
            player.real += 5;
        },
        choices:[
            ["听她继续说","club_invite"]
        ]
    },


    club_invite:{
        chapter:"第一章：不可视界线研究社",
        name:"程岚",
        text:`
            “那么。”

            <br><br>

            程岚从书包里拿出一张申请表。

            <br><br>

            “加入我的社团吧。”

            <br><br>

            我低头看了一眼。

            <br><br>

            【不可视界线研究社】

            <br><br>

            “这是什么？”

            <br><br>

            “研究现实与不可视世界的边界。”

            <br><br>

            “寻找隐藏在日常中的异常。”

            <br><br>

            “还有……”

            <br><br>

            她停了一下。

            <br><br>

            “寻找能够理解我的人。”

            <br><br>

            最后一句话。

            <br><br>

            和前面的中二设定完全不同。

            <br><br>

            反而让我有些不知道该怎么回答。
        `,
        choices:[
            ["加入她","join_club"],
            ["拒绝","refuse_club"]
        ]
    },


    refuse_club:{
        chapter:"第一章：不可视界线研究社",
        name:"我",
        text:`
            “抱歉。”

            <br><br>

            “我还是想过普通一点的生活。”

            <br><br>

            程岚没有生气。

            <br><br>

            她只是收起申请表。

            <br><br>

            “我知道了。”

            <br><br>

            我松了一口气。

            <br><br>

            可第二天早上。

            <br><br>

            我的桌面上多了一张申请表。

            <br><br>

            上面写着：

            <br><br>

            【再次邀请】

            <br><br>

            我：“……”

            <br><br>

            她到底有没有听懂我的意思？
        `,
        choices:[
            ["还是加入吧","join_club"]
        ]
    },


    join_club:{
        chapter:"第一章：不可视界线研究社",
        name:"我",
        text:`
            我拿起笔。

            <br><br>

            在申请表上签下自己的名字。

            <br><br>

            其实。

            <br><br>

            我应该拒绝的。

            <br><br>

            可是。

            <br><br>

            看着程岚那双认真注视着我的眼睛。

            <br><br>

            我突然想起了曾经的自己。

            <br><br>

            那个相信世界拥有秘密的少年。

            <br><br>

            或许。

            <br><br>

            我真的没有完全忘记他。
        `,
        effect:function(){
            player.love += 5;
        },
        choices:[
            ["正式开始社团活动","club_start"]
        ]
    },


    club_start:{
        chapter:"第一章：不可视界线研究社",
        name:"我",
        text:`
            放学后。

            <br><br>

            我来到社团室。

            <br><br>

            房间比我想象中还要普通。

            <br><br>

            几张桌子。

            <br>
            一个书柜。

            <br>
            一块黑板。

            <br><br>

            程岚已经坐在那里。

            <br><br>

            “欢迎回来。”

            <br><br>

            我皱眉。

            <br><br>

            “我们好像才第一次正式见面。”

            <br><br>

            “但是你已经是成员了。”

            <br><br>

            她回答得理所当然。

            <br><br>

            就在这时。

            <br><br>

            社团室的大门被推开。
        `,
        choices:[
            ["看看是谁","laning_enter"]
        ]
    },


    laning_enter:{
        chapter:"第一章：兰宁登场",
        name:"兰宁",
        text:`
            “终于找到你了！”

            <br><br>

            我愣住。

            <br><br>

            门口站着一个女生。

            <br><br>

            她看起来非常兴奋。

            <br><br>

            她的视线直接越过我。

            <br><br>

            落在程岚身上。

            <br><br>

            “师傅！”

            <br><br>

            程岚：

            <br>

            “兰宁？”

            <br><br>

            兰宁用力点头。

            <br><br>

            “我感受到命运的召唤！”

            <br><br>

            我看向钰翔。

            <br><br>

            “她也是你们学校的吗？”

            <br><br>

            钰翔：

            <br>

            “我第一次见。”

            <br><br>

            我突然感觉。

            <br><br>

            这个社团可能比我想象中更加麻烦。
        `,
        choices:[
            ["让兰宁加入","laning_join"]
        ]
    },


    laning_join:{
        chapter:"第一章：兰宁登场",
        name:"我",
        text:`
            兰宁非常顺利地加入了社团。

            <br><br>

            顺利到我甚至怀疑学校是不是根本没有审核。

            <br><br>

            现在。

            <br><br>

            社团成员变成了：

            <br><br>

            程岚。

            <br>
            我。

            <br>
            钰翔。

            <br>
            兰宁。

            <br><br>

            我看着这四个人。

            <br><br>

            总觉得自己离“普通高中生活”越来越远了。

            <br><br>

            但奇怪的是。

            <br><br>

            我并没有讨厌这种感觉。

            <br><br>

            就在这时。

/* =========================================================
   打字机
========================================================= */

function stripHTML(html){
    const temp=document.createElement("div");
    temp.innerHTML=html;
    return temp.textContent || temp.innerText || "";
}


function typeWriter(text){

    const box=document.getElementById("text");

    clearInterval(typingTimer);

    currentText=text;
    currentIndex=0;

    box.innerHTML="";

    typing=true;

    document.getElementById("clickHint").innerText="点击文字立即显示全文";

    typingTimer=setInterval(()=>{

        currentIndex++;

        box.innerHTML=currentText.substring(0,currentIndex);

        box.scrollTop=box.scrollHeight;

        if(currentIndex>=currentText.length){

            clearInterval(typingTimer);

            typing=false;

            document.getElementById("clickHint").innerText="";

        }

    },18);

}


/* =========================================================
   立即显示全文
========================================================= */

function showFullText(){

    if(!typing) return;

    clearInterval(typingTimer);

    document.getElementById("text").innerHTML=currentText;

    document.getElementById("text").scrollTop=0;

    currentIndex=currentText.length;

    typing=false;

    document.getElementById("clickHint").innerText="";

}


/* =========================================================
   渲染
========================================================= */

function render(){

    const data=story[scene];

    if(!data){

        console.error("找不到剧情节点:",scene);

        return;

    }


    if(typeof data.effect==="function"){

        data.effect();

        data.effect=null;

    }


    document.getElementById("chapterTitle").innerText=data.chapter || "";

    document.getElementById("name").innerText=data.name || "";

    document.getElementById("love").innerText=player.love;

    document.getElementById("chuni").innerText=player.chuni;

    document.getElementById("real").innerText=player.real;


    const choiceBox=document.getElementById("choice");

    choiceBox.innerHTML="";


    data.choices.forEach(choice=>{

        const button=document.createElement("button");

        button.innerText="✦ "+choice[0];

        button.onclick=function(){

            scene=choice[1];

            render();

        };

        choiceBox.appendChild(button);

    });


    typeWriter(data.text);

}


/* =========================================================
   点击文字
========================================================= */

document.getElementById("text").addEventListener("click",showFullText);

document.getElementById("clickHint").addEventListener("click",showFullText);


/* =========================================================
   开始游戏
========================================================= */

render();

</script>
